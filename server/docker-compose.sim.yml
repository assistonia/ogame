# Simulation stack: overrides on top of server/ogamex/docker-compose.yml.
#
# Use via server/sim.sh (it passes the right -f/--project-directory flags).
#
# Differences from the upstream dev stack:
# - The app runs on a prebuilt PHP 8.5 image (serversideup/php) instead of
#   building one. No apt/rustup at build time, so it also works on hosts with
#   restricted egress. Code is bind-mounted, as in upstream dev.
# - The Rust battle engine is not compiled; the sim sets battle_engine=php.
# - Only db + app + webserver run. The realtime scheduler, queue worker,
#   websocket server and phpMyAdmin are behind the "realtime" profile because
#   the simulator drives the game clock itself (ogamex:sim:advance).
services:
  ogamex-app:
    image: ${SIM_PHP_IMAGE:-serversideup/php:8.5-fpm}
    build: !reset null
    user: "0:0"
    entrypoint: ["/bin/sh", "/var/www/sim-entrypoint.sh"]
    volumes:
      - ../sim-entrypoint.sh:/var/www/sim-entrypoint.sh:ro
    environment:
      CONTAINER_ROLE: app
      SIM_CLOCK_ENABLED: "${SIM_CLOCK_ENABLED:-1}"
      PHP_FPM_PM_MAX_CHILDREN: "${PHP_FPM_WORKERS:-16}"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "8"
      PHP_FPM_PM_START_SERVERS: "4"
      PHP_MEMORY_LIMIT: "1024M"
      PHP_MAX_EXECUTION_TIME: "300"
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 120

  ogamex-db:
    ports: !override
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3306}:3306"

  ogamex-webserver:
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8000}:80"

  ogamex-scheduler:
    profiles: ["realtime"]
  ogamex-queue-worker:
    profiles: ["realtime"]
  ogamex-reverb:
    profiles: ["realtime"]
  ogamex-phpmyadmin:
    profiles: ["realtime"]
